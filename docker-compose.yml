services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
        VITE_LIVE_BASE_PATH: /live
    restart: always
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_BASE_PATH: /api
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL}
        VITE_WEB_BASE_PATH: ""
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
        VITE_LIVE_BASE_PATH: /live
        VITE_WEBSITE_URL: https://plane.so
        VITE_SUPPORT_EMAIL: support@plane.so
    restart: always
    depends_on:
      - api
      - web

  space:
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_BASE_PATH: /api
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL}
        VITE_WEB_BASE_PATH: ""
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
        VITE_LIVE_BASE_PATH: /live
        VITE_WEBSITE_URL: https://plane.so
        VITE_SUPPORT_EMAIL: support@plane.so
    restart: always
    depends_on:
      - api
      - web

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    environment:
      DEBUG: "0"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://plane-redis:6379/
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      USE_MINIO: "1"
      WEB_URL: ${VITE_WEB_BASE_URL}
      APP_BASE_URL: ${VITE_WEB_BASE_URL}
      APP_BASE_PATH: ""
      ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
      ADMIN_BASE_PATH: /god-mode
      SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
      SPACE_BASE_PATH: /spaces
      LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
      LIVE_BASE_PATH: /live
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS:-60}
      MINIO_ENDPOINT_SSL: "0"
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      DOCKERIZED: "1"
    depends_on:
      - plane-db
      - plane-redis

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      DEBUG: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://plane-redis:6379/
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      USE_MINIO: "1"
      WEB_URL: ${VITE_WEB_BASE_URL}
      APP_BASE_URL: ${VITE_WEB_BASE_URL}
      APP_BASE_PATH: ""
      ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
      ADMIN_BASE_PATH: /god-mode
      SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
      SPACE_BASE_PATH: /spaces
      LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
      LIVE_BASE_PATH: /live
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS:-60}
      MINIO_ENDPOINT_SSL: "0"
      DOCKERIZED: "1"
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      DEBUG: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://plane-redis:6379/
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      USE_MINIO: "1"
      WEB_URL: ${VITE_WEB_BASE_URL}
      APP_BASE_URL: ${VITE_WEB_BASE_URL}
      APP_BASE_PATH: ""
      ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL}
      ADMIN_BASE_PATH: /god-mode
      SPACE_BASE_URL: ${VITE_SPACE_BASE_URL}
      SPACE_BASE_PATH: /spaces
      LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
      LIVE_BASE_PATH: /live
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS:-60}
      DOCKERIZED: "1"
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      DEBUG: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://plane-redis:6379/
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - plane-db
      - plane-redis

  live:
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
    restart: always
    environment:
      PORT: "3100"
      API_BASE_URL: ${VITE_API_BASE_URL}
      WEB_BASE_URL: ${VITE_WEB_BASE_URL}
      LIVE_BASE_URL: ${VITE_LIVE_BASE_URL}
      LIVE_BASE_PATH: /live
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      REDIS_PORT: "6379"
      REDIS_HOST: plane-redis
      REDIS_URL: redis://plane-redis:6379/
    depends_on:
      - plane-redis

  plane-db:
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  proxy:
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - "80"
    environment:
      SITE_ADDRESS: :80
      CERT_EMAIL: ""
      TRUSTED_PROXIES: "0.0.0.0/0"
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    networks:
      - dokploy-network
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:

networks:
  dokploy-network:
    external: true
